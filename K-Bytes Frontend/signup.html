<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - K-Bytes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
    
    <!-- Navigation Back -->
    <a href="home.html" class="back-home">&#10094; Back to Home</a>

    <!-- Centered Sign Up Card -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join K-Bytes and start ordering today.</p>
            
            <form class="auth-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password" required>
                </div>
                
                <!-- Links to the User Menu for mockup purposes -->
                <a href="menu-user.html" class="btn auth-btn">Sign Up</a>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Login</a></p>
            </div>
        </div>
    </div>

</body>
</html>
