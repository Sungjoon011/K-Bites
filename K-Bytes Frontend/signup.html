<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - K-Bytes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
    
    <!-- Navigation Back -->
    <a href="home.html" class="back-home">&#10094; Back to Login</a>

    <!-- Centered Signup Card -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Sign up to start ordering from K-Bytes.</p>
            
           <form id="signup-form" class="auth-form">
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="Enter your full name" required>
    </div>
    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signup-email" placeholder="Enter your email" required>
    </div>
        <div class="form-group">
        <label>Password</label>
            <div class="password-container">
                <input type="password" id="signup-password" placeholder="Create a password" required>
                <button type="button" id="toggle-signup-password" class="toggle-password-btn">Show</button>
            </div>
        </div>
    <button type="submit" class="btn auth-btn">Sign Up</button>
</form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Login</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
