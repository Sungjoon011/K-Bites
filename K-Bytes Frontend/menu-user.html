<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Menu - K-Bytes</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- Notice there is NO 'public-view' ID here, so the Add to Cart buttons will show up! -->
<body class="menu-page-body">
    
    <!-- User Navbar (Includes Cart and Logout) -->
    <nav class="nav-solid">
        <div class="logo">
            <a href="home.html">K-Bytes</a>
        </div>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="#contact">Contact</a></li>
            <li>
                <!-- Cart Trigger Button -->
                <button class="cart-nav-btn">
                    🛒 Cart <span class="cart-badge">0</span>
                </button>
            </li>
            <li><a href="home.html" class="login-btn">Logout</a></li>
        </ul>
    </nav>

    <!-- Top Banner -->
    <header class="menu-banner">
        <h2>Taste the Streets of Seoul</h2>
        <p>Experience our most popular late-night cravings.</p>
    </header>

    <!-- The 2-Column App Layout -->
    <section class="app-layout">
        
        <!-- Left Sidebar Menu -->
        <aside class="app-sidebar">
            <h2 class="sidebar-title">Menu</h2>
            <ul class="sidebar-list">
                <li><button class="sidebar-btn active" data-category="All">🍔 All Categories</button></li>
                <li><button class="sidebar-btn" data-category="Bap">🍚 Bap (Rice)</button></li>
                <li><button class="sidebar-btn" data-category="Banchan">🥬 Banchan (Sides)</button></li>
                <li><button class="sidebar-btn" data-category="Guk & Tang">🥣 Guk & Tang</button></li>
                <li><button class="sidebar-btn" data-category="Jjigae">🥘 Jjigae (Stews)</button></li>
                <li><button class="sidebar-btn" data-category="Myeon">🍜 Myeon (Noodles)</button></li>
                <li><button class="sidebar-btn" data-category="Gui">🥓 Gui (Grilled)</button></li>
                <li><button class="sidebar-btn" data-category="Bokkeum">🌶️ Bokkeum</button></li>
                <li><button class="sidebar-btn" data-category="Jorim">🍗 Jorim (Braised)</button></li>
            </ul>
        </aside>

        <!-- Right Main Content -->
        <main class="app-main">
            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="🔍 Search Menu Here...">
            </div>
            
            <h2 id="category-display-title">All Categories</h2>
            
            <!-- The Grid Container -->
            <div id="food-grid" class="app-grid">
                <!-- JavaScript will automatically inject the dishes and Add buttons here -->
            </div>
        </main>

    </section>

    <!-- ========================================== -->
    <!-- HIDDEN CART SIDEBAR (Slides in when clicked) -->
    <!-- ========================================== -->
    <div class="cart-overlay" id="cart-overlay"></div>

    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-btn" id="close-cart">&times;</button>
        </div>
        
        <div class="cart-items" id="cart-items">
            <!-- JS injects cart items here -->
            <p class="empty-cart-msg">Your cart is empty.</p>
        </div>
        
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">₱0.00</span>
            </div>
            <!-- Uses your original .btn styling for the bright red button -->
            <button class="btn checkout-btn" id="checkout-btn">PROCEED TO CHECKOUT</button>
            <button class="clear-cart-btn" id="clear-cart-btn">Clear Cart</button>
        </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
