<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - K-Bytes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
    
    <!-- Navigation Back -->
    <a href="home.html" class="back-home">&#10094; Back to Home</a>

    <!-- Centered Login Card -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Login to K-Bytes to order your favorites.</p>
            
            <form class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <!-- Links to the User Menu for mockup purposes -->
                <a href="menu-user.html" class="btn auth-btn">Login</a>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html" class="auth-link">Sign up</a></p>
            </div>
        </div>
    </div>

</body>
</html>
