<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - K-Bytes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
    
    <!-- Navigation Back -->
    <a href="home.html" class="back-home">&#10094; Back to Home</a>

    <!-- Centered Login Card -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Login to K-Bytes to order your favorites.</p>
            
            <!-- Added id="login-form" -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <!-- Added id="login-email" -->
                    <input type="email" id="login-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                <label>Password</label>
                    <div class="password-container">
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                        <button type="button" id="toggle-login-password" class="toggle-password-btn">Show</button>
                    </div>
                </div>
                <!-- Changed anchor link to an actual submit button -->
                <button type="submit" class="btn auth-btn">Login</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html" class="auth-link">Sign up</a></p>
            </div>
        </div>
    </div>

    <!-- Linked script.js to handle the fetch request -->
    <script src="script.js"></script>
</body>
</html>
